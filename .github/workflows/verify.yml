name: Verify Wedding ERP Online
on:
  push:
    branches: [feat/github-pages-supabase-only]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check frontend syntax
        run: node --check public/app.js
      - name: Check Supabase API health
        run: curl --fail --silent --show-error https://ugvtuxuimjcshqckgepi.supabase.co/functions/v1/erp-api/health
