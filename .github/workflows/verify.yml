name: Verify Wedding ERP Online
on:
  push:
    branches: [feat/github-pages-supabase-only]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check frontend syntax
        run: node --check public/app.js
      - name: Check Supabase API health
        run: |
          response=$(curl --silent --show-error --write-out "\nHTTP_STATUS:%{http_code}\n" https://ugvtuxuimjcshqckgepi.supabase.co/functions/v1/erp-api/health)
          echo "$response"
          echo "$response" | grep -q "HTTP_STATUS:200"

      - name: Check published website
        run: curl --fail --silent --show-error https://gedoresturant.github.io/wedding/ | grep -q 'id="loginForm"'

      - name: Check GitHub raw asset CORS
        run: curl --silent --show-error --head https://raw.githubusercontent.com/gedoresturant/wedding/feat/github-pages-supabase-only/public/app.js | grep -i 'access-control-allow-origin'
