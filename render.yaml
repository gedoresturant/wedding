services:
  - type: web
    name: wedding-halls-erp
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: wedding-halls-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

      - key: SUPABASE_SYNC_ENABLED
        value: "true"
      - key: SUPABASE_SYNC_INTERVAL_MS
        value: "60000"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
